<title id="tg">Organización genómica del Crinivirus tomatichlorosis (ToCV)</title>
<desc id="td">ARN1 (8595 nt) y ARN2 (8247 nt) dibujados a escala con los marcos de lectura abiertos anotados en GenBank NC_007340 y NC_007341.</desc>
